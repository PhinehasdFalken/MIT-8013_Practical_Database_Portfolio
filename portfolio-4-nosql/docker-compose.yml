# Portfolio 4 – NoSQL stores for Finesse Klass
#   docker compose up -d        (start)
#   docker compose down         (stop; add -v to also delete the data)
services:
  mongo:
    image: mongo:7
    container_name: fk-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo:/scripts          # lets us run: docker exec fk-mongo mongosh ... --file /scripts/xx.js
      - fk-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: fk-redis
    ports:
      - "6379:6379"

volumes:
  fk-mongo-data:
